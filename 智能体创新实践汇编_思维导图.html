const map = document.getElementById('map');
const leftEl = document.getElementById('left');
const rightEl = document.getElementById('right');
document.getElementById('root').textContent = DATA.root;
const byName = {};
DATA.cats.forEach(c=>byName[c.name]=c);

function buildSide(el, names, side){
  names.forEach(n=>{
    const c = byName[n];
    const br = document.createElement('div');
    br.className = 'branch ' + side;
    const cat = document.createElement('div');
    cat.className = 'cat';
    cat.innerHTML = c.name + '<span class="cnt">'+c.count+' 例</span>';
    const ch = document.createElement('div');
    ch.className = 'children';
    c.cases.forEach(k=>{
      const lf = document.createElement('div');
      lf.className = 'leaf';
      lf.innerHTML = escapeHtml(k.title) + '<span class="u">'+escapeHtml(k.unit)+' · folio '+k.folio+'</span>';
      ch.appendChild(lf);
    });
    cat.onclick = ()=> br.classList.toggle('collapsed');
    br.appendChild(cat); br.appendChild(ch);
    el.appendChild(br);
  });
}
buildSide(leftEl, DATA.left, 'l');
buildSide(rightEl, DATA.right, 'r');

function escapeHtml(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function center(el){const r=el.getBoundingClientRect();const m=map.getBoundingClientRect();
  return {x:r.left-m.left+r.width/2, y:r.top-m.top+r.height/2};}

function redraw(){
  const svg = document.getElementById('links');
  const m = map.getBoundingClientRect();
  svg.setAttribute('width', m.width); svg.setAttribute('height', m.height);
  svg.innerHTML='';
  const root = center(document.getElementById('root'));
  document.querySelectorAll('.branch').forEach(br=>{
    const cat = br.querySelector('.cat');
    const cc = center(cat);
    drawLine(svg, root, cc, br.classList.contains('l')?'var(--left)':'var(--right)', 2.2);
    if(!br.classList.contains('collapsed')){
      br.querySelectorAll('.leaf').forEach(lf=>{
        const lc = center(lf);
        drawLine(svg, cc, lc, 'var(--line)', 1);
      });
    }
  });
}
function drawLine(svg,a,b,color,w){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  const midx=(a.x+b.x)/2;
  const d='M'+a.x+' '+a.y+' C '+midx+' '+a.y+', '+midx+' '+b.y+', '+b.x+' '+b.y;
  p.setAttribute('d',d); p.setAttribute('fill','none');
  p.setAttribute('stroke',color); p.setAttribute('stroke-width',w);
  svg.appendChild(p);
}
function allExpand(){document.querySelectorAll('.branch').forEach(b=>b.classList.remove('collapsed'));requestAnimationFrame(redraw);}
function allCollapse(){document.querySelectorAll('.branch').forEach(b=>b.classList.add('collapsed'));requestAnimationFrame(redraw);}
window.addEventListener('load',()=>requestAnimationFrame(redraw));
window.addEventListener('resize',redraw);
// redraw after fonts/layout settle
setTimeout(redraw,300);
</script>
